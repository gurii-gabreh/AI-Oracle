<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Oracle v3</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent: #7c6af7;
    --accent2: #4fd1c5;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #48bb78;
    --warning: #f6ad55;
    --danger: #fc8181;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.6s ease;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  /* 設定 */
  .settings-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 0.4rem 0.8rem;
    transition: all 0.2s;
    margin-bottom: 1rem;
    display: block;
  }
  .settings-toggle:hover { color: var(--text); border-color: var(--accent); }

  .settings-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .settings-panel.open { display: block; animation: fadeUp 0.2s ease; }

  .settings-field label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .settings-field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 0.6rem 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .settings-field input:focus { border-color: var(--accent); }

  .save-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 0.6rem 1.2rem;
    transition: all 0.2s;
    margin-top: 0.75rem;
  }
  .save-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 入力 */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .input-label {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    padding: 1rem;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    min-height: 100px;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .input-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1rem;
    gap: 1rem;
  }

  .char-count { font-size: 0.75rem; color: var(--muted); }

  .ask-btn {
    background: linear-gradient(135deg, var(--accent), #5a4fd4);
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.75rem 2rem;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .ask-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124,106,247,0.35);
  }
  .ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* プロセス */
  .process-bar {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .process-bar.active { display: block; animation: fadeUp 0.3s ease; }

  .process-text {
    font-size: 0.82rem;
    color: var(--accent2);
    margin-bottom: 0.75rem;
  }

  .process-steps { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }

  .step {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: all 0.3s;
  }
  .step.active { color: var(--accent2); border-color: var(--accent2); background: rgba(79,209,197,0.08); }
  .step.done   { color: var(--success); border-color: var(--success); background: rgba(72,187,120,0.08); }
  .step-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .step.active .step-dot { animation: pulse 1s infinite; }

  /* 結果 */
  .result-card { display: none; }
  .result-card.visible { display: block; animation: fadeUp 0.4s ease; }

  /* 結論カード */
  .conclusion-card {
    background: linear-gradient(135deg, rgba(124,106,247,0.1), rgba(79,209,197,0.05));
    border: 1px solid rgba(124,106,247,0.3);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  .conclusion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .conclusion-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .contradiction-badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    background: rgba(252,129,129,0.15);
    color: var(--danger);
    border: 1px solid rgba(252,129,129,0.3);
    display: none;
  }

  .conclusion-text {
    font-size: 0.92rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .contradiction-detail {
    background: rgba(252,129,129,0.08);
    border: 1px solid rgba(252,129,129,0.2);
    border-radius: 8px;
    padding: 0.75rem;
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: var(--danger);
    display: none;
  }

  /* 使用AIモデル */
  .models-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .models-title {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .models-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .model-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.72rem;
    padding: 0.3rem 0.75rem;
    color: var(--accent2);
  }

  /* 各AIの回答 */
  .answers-section { margin-bottom: 1rem; }

  .answers-title {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
    padding-left: 0.25rem;
  }

  .answer-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 0.75rem;
    overflow: hidden;
  }

  .answer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    cursor: pointer;
    transition: background 0.2s;
    background: var(--surface2);
  }
  .answer-header:hover { background: rgba(124,106,247,0.08); }

  .answer-model {
    font-size: 0.78rem;
    color: var(--accent2);
    font-weight: 500;
  }

  .answer-toggle {
    font-size: 0.7rem;
    color: var(--muted);
    transition: transform 0.2s;
  }

  .answer-body {
    display: none;
    padding: 1rem;
    border-top: 1px solid var(--border);
  }

  .answer-body.open { display: block; animation: fadeUp 0.2s ease; }

  .answer-text {
    font-size: 0.85rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  /* 履歴 */
  .history-section { margin-top: 2rem; }
  .history-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.82rem;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-q { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-meta { font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-size: 0.8rem;
    z-index: 999;
    animation: fadeUp 0.3s ease;
    white-space: nowrap;
  }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
  }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(12px);  } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes spin     { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .logo { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">AI Oracle</div>
    <div class="tagline">Gemini × OpenRouter · Multi-Model Intelligence</div>
  </header>

  <!-- 設定 -->
  <button class="settings-toggle" onclick="toggleSettings()">⚙ サーバー設定</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-field">
      <label>サーバーURL（MacのIPアドレス）</label>
      <input type="text" id="serverUrl" placeholder="http://192.168.1.30:8002">
    </div>
    <button class="save-btn" onclick="saveSettings()">保存</button>
  </div>

  <!-- 入力 -->
  <div class="input-section">
    <div class="input-label">質問を入力　（Cmd+Enter で送信）</div>
    <textarea
      id="questionInput"
      placeholder="何でも聞いてください。複数のAIが回答し、Geminiが結論をまとめます..."
      oninput="updateCharCount(this)"
      onkeydown="handleKeydown(event)"
    ></textarea>
    <div class="input-footer">
      <span class="char-count" id="charCount">0文字</span>
      <button class="ask-btn" id="askBtn" onclick="ask()">回答を生成</button>
    </div>
  </div>

  <!-- プロセス -->
  <div class="process-bar" id="processBar">
    <div class="process-text">Gemini CLIが処理中です（最大120秒）...</div>
    <div class="process-steps">
      <div class="step" id="step1"><div class="step-dot"></div>質問分析</div>
      <div class="step" id="step2"><div class="step-dot"></div>OpenRouter呼び出し</div>
      <div class="step" id="step3"><div class="step-dot"></div>各AI回答取得</div>
      <div class="step" id="step4"><div class="step-dot"></div>Gemini結論生成</div>
      <div class="step" id="step5"><div class="step-dot"></div>完了</div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="result-card" id="resultCard">

    <!-- 結論 -->
    <div class="conclusion-card">
      <div class="conclusion-header">
        <span class="conclusion-title">🔮 Geminiの結論</span>
        <span class="contradiction-badge" id="contradictionBadge">⚠ 矛盾あり</span>
      </div>
      <div class="conclusion-text" id="conclusionText"></div>
      <div class="contradiction-detail" id="contradictionDetail"></div>
    </div>

    <!-- 使用AIモデル -->
    <div class="models-card">
      <div class="models-title">使用したAIモデル</div>
      <div class="models-list" id="modelsList"></div>
    </div>

    <!-- 各AIの回答 -->
    <div class="answers-section">
      <div class="answers-title">各AIの回答</div>
      <div id="answersList"></div>
    </div>

  </div>

  <!-- 履歴 -->
  <div class="history-section" id="historySection" style="display:none">
    <div class="history-title">最近の質問</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
const STORAGE_KEY = 'ai_oracle_v3_settings';
const HISTORY_KEY = 'ai_oracle_v3_history';
let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

function getSettings() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"serverUrl":"http://192.168.1.30:8002"}');
}

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('open');
  const s = getSettings();
  document.getElementById('serverUrl').value = s.serverUrl || '';
}

function saveSettings() {
  const s = { serverUrl: document.getElementById('serverUrl').value.trim() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  document.getElementById('settingsPanel').classList.remove('open');
  showToast('✓ 設定を保存しました');
}

async function ask() {
  const question = document.getElementById('questionInput').value.trim();
  if (!question) return;

  const s = getSettings();
  if (!s.serverUrl) {
    showToast('⚙ サーバーURLを設定してください');
    toggleSettings();
    return;
  }

  const btn = document.getElementById('askBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 処理中...';

  document.getElementById('processBar').classList.add('active');
  document.getElementById('resultCard').classList.remove('visible');
  resetSteps();

  // ステップを順番に進める
  setStep('step1', 'active');
  await delay(2000);
  setStep('step1', 'done');
  setStep('step2', 'active');
  await delay(3000);
  setStep('step2', 'done');
  setStep('step3', 'active');

  try {
    const res = await fetch(`${s.serverUrl}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });

    setStep('step3', 'done');
    setStep('step4', 'active');

    const data = await res.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');

    await delay(500);
    setStep('step4', 'done');
    setStep('step5', 'active');
    await delay(300);
    setStep('step5', 'done');

    renderResult(data);
    saveHistory(question, data.models_used);

  } catch(e) {
    console.error(e);
    showToast('エラー: ' + e.message);
    resetSteps();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '回答を生成';
    document.getElementById('processBar').classList.remove('active');
  }
}

function renderResult(data) {
  // 結論
  document.getElementById('conclusionText').textContent = data.conclusion || '結論を取得できませんでした';

  // 矛盾
  if (data.has_contradiction && data.contradiction_detail) {
    document.getElementById('contradictionBadge').style.display = 'block';
    const detail = document.getElementById('contradictionDetail');
    detail.textContent = '⚠ ' + data.contradiction_detail;
    detail.style.display = 'block';
  }

  // 使用モデル
  const modelsList = document.getElementById('modelsList');
  modelsList.innerHTML = (data.models_used || []).map(m =>
    `<span class="model-badge">${m.split('/').pop()}</span>`
  ).join('');

  // 各AIの回答
  const answersList = document.getElementById('answersList');
  answersList.innerHTML = (data.answers || []).map((a, i) => `
    <div class="answer-item">
      <div class="answer-header" onclick="toggleAnswer(${i})">
        <span class="answer-model">🤖 ${a.model}</span>
        <span class="answer-toggle" id="toggle-${i}">▼ 展開</span>
      </div>
      <div class="answer-body" id="answer-${i}">
        <div class="answer-text">${escHtml(a.answer || '回答なし')}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('resultCard').classList.add('visible');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleAnswer(i) {
  const body   = document.getElementById(`answer-${i}`);
  const toggle = document.getElementById(`toggle-${i}`);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  toggle.textContent = isOpen ? '▼ 展開' : '▲ 閉じる';
}

function saveHistory(question, models) {
  history.unshift({ question, models, time: new Date().toLocaleString('ja-JP') });
  history = history.slice(0, 10);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  if (!history.length) return;
  document.getElementById('historySection').style.display = 'block';
  document.getElementById('historyList').innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="loadHistory(${i})">
      <div class="history-q">${h.question}</div>
      <div class="history-meta">${h.time}</div>
    </div>
  `).join('');
}

function loadHistory(i) {
  document.getElementById('questionInput').value = history[i].question;
  updateCharCount(document.getElementById('questionInput'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateCharCount(el) {
  document.getElementById('charCount').textContent = el.value.length + '文字';
}

function handleKeydown(e) {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask();
}

function setStep(id, state) {
  document.getElementById(id).className = 'step ' + state;
}

function resetSteps() {
  ['step1','step2','step3','step4','step5'].forEach(id => {
    document.getElementById(id).className = 'step';
  });
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// 初期化
const savedSettings = getSettings();
document.getElementById('serverUrl') && (document.getElementById('serverUrl').value = savedSettings.serverUrl || '');
renderHistory();
</script>
</body>
</html>
