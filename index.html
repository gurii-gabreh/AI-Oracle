<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --sidebar: #0c0c18;
  --surface: #111120;
  --surface2: #181828;
  --border: #1e1e35;
  --accent: #7c6af7;
  --accent2: #4fd1c5;
  --text: #e8e8f0;
  --muted: #4a4a6a;
  --success: #48bb78;
  --danger: #fc8181;
  --warning: #f6ad55;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* サイドバー */
.sidebar {
  width: 240px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 1rem;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.75rem;
}

.new-chat-btn {
  width: 100%;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-family: 'Syne', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0.6rem;
  transition: all 0.2s;
}
.new-chat-btn:hover { background: #6357e0; }

.sidebar-section-title {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0.75rem 1rem 0.4rem;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 0.25rem 0.5rem;
  scrollbar-width: none;
}
.chat-list::-webkit-scrollbar { display: none; }

.chat-item {
  border-radius: 8px;
  cursor: pointer;
  padding: 0.6rem 0.75rem;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 2px;
}
.chat-item:hover { background: var(--surface); }
.chat-item.active { background: var(--surface2); border: 1px solid var(--border); }

.chat-item-title {
  font-size: 0.75rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.chat-item-del {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.7rem;
  opacity: 0;
  padding: 0.1rem 0.2rem;
  border-radius: 4px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.chat-item:hover .chat-item-del { opacity: 1; }
.chat-item-del:hover { color: var(--danger); }

.sidebar-footer {
  padding: 0.75rem 1rem;
  border-top: 1px solid var(--border);
}

.settings-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  padding: 0.5rem 0.75rem;
  transition: all 0.2s;
  width: 100%;
}
.settings-btn:hover { color: var(--text); border-color: var(--accent); }

/* メインエリア */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* 設定パネル */
.settings-panel {
  display: none;
  position: absolute;
  bottom: 80px;
  left: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  width: 280px;
  z-index: 100;
  animation: fadeUp 0.2s ease;
}
.settings-panel.open { display: block; }

.settings-field label {
  display: block;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.4rem;
}
.settings-field input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  padding: 0.5rem 0.7rem;
  outline: none;
  transition: border-color 0.2s;
}
.settings-field input:focus { border-color: var(--accent); }

.save-settings-btn {
  background: var(--accent);
  border: none;
  border-radius: 6px;
  color: #fff;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  padding: 0.5rem 1rem;
  margin-top: 0.75rem;
  transition: all 0.2s;
}
.save-settings-btn:hover { background: #6357e0; }

/* チャットエリア */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* 空の状態 */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  gap: 1rem;
}

.empty-logo {
  font-family: 'Syne', sans-serif;
  font-size: 2.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.empty-desc {
  font-size: 0.82rem;
  color: var(--muted);
  max-width: 320px;
  line-height: 1.6;
}

.empty-suggestions {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 0.5rem;
}

.suggestion-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  padding: 0.6rem 1rem;
  transition: all 0.2s;
  text-align: left;
}
.suggestion-btn:hover { border-color: var(--accent); color: var(--accent); }

/* メッセージ */
.message {
  margin-bottom: 1.5rem;
  animation: fadeUp 0.3s ease;
}

.message-user {
  display: flex;
  justify-content: flex-end;
}

.message-user-bubble {
  background: var(--accent);
  border-radius: 14px 14px 4px 14px;
  color: #fff;
  font-size: 0.88rem;
  line-height: 1.6;
  max-width: 70%;
  padding: 0.75rem 1rem;
}

.message-ai {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

/* 結論カード */
.conclusion-card {
  background: linear-gradient(135deg, rgba(124,106,247,0.08), rgba(79,209,197,0.04));
  border: 1px solid rgba(124,106,247,0.25);
  border-radius: 14px;
  padding: 1.25rem;
}

.conclusion-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
}

.conclusion-label {
  font-family: 'Syne', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

.contradiction-badge {
  font-size: 0.65rem;
  padding: 0.15rem 0.5rem;
  border-radius: 20px;
  background: rgba(252,129,129,0.15);
  color: var(--danger);
  border: 1px solid rgba(252,129,129,0.3);
}

.conclusion-text {
  font-size: 0.88rem;
  line-height: 1.8;
  color: var(--text);
  white-space: pre-wrap;
}

.contradiction-detail {
  background: rgba(252,129,129,0.08);
  border: 1px solid rgba(252,129,129,0.2);
  border-radius: 8px;
  padding: 0.6rem 0.75rem;
  margin-top: 0.75rem;
  font-size: 0.78rem;
  color: var(--danger);
}

/* 使用モデル */
.models-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-items: center;
}

.models-label {
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-right: 0.25rem;
}

.model-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.68rem;
  padding: 0.2rem 0.6rem;
  color: var(--accent2);
}

/* 各AIの回答 */
.answers-list { display: flex; flex-direction: column; gap: 0.5rem; }

.answer-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.answer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 0.9rem;
  cursor: pointer;
  background: var(--surface2);
  transition: background 0.15s;
}
.answer-header:hover { background: rgba(124,106,247,0.08); }

.answer-model { font-size: 0.75rem; color: var(--accent2); }
.answer-toggle { font-size: 0.68rem; color: var(--muted); transition: transform 0.2s; }

.answer-body {
  display: none;
  padding: 0.9rem;
  border-top: 1px solid var(--border);
}
.answer-body.open { display: block; animation: fadeUp 0.2s ease; }

.answer-text {
  font-size: 0.82rem;
  line-height: 1.8;
  color: var(--text);
  white-space: pre-wrap;
}

/* ローディング */
.loading-message {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 0.82rem;
  color: var(--muted);
}

.loading-dots {
  display: flex;
  gap: 4px;
}

.loading-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: dotPulse 1.4s infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }

/* 入力エリア */
.input-area {
  border-top: 1px solid var(--border);
  padding: 1rem 1.5rem;
  background: var(--sidebar);
}

.input-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: flex-end;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  transition: border-color 0.2s;
}
.input-box:focus-within { border-color: var(--accent); }

textarea {
  background: none;
  border: none;
  color: var(--text);
  flex: 1;
  font-family: 'DM Mono', monospace;
  font-size: 0.88rem;
  line-height: 1.5;
  max-height: 150px;
  outline: none;
  resize: none;
  scrollbar-width: none;
}
textarea::placeholder { color: var(--muted); }

.send-btn {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 1rem;
  height: 36px;
  transition: all 0.2s;
  width: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.send-btn:hover:not(:disabled) { background: #6357e0; transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.input-hint {
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: 0.4rem;
  text-align: right;
}

/* モバイル対応 */
.sidebar-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  font-size: 1.2rem;
  padding: 0.5rem;
}

@media (max-width: 680px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: block; }
  .mobile-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--sidebar);
  }
  .mobile-logo {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 199;
  }
  .overlay.open { display: block; }
}

@media (min-width: 681px) {
  .mobile-header { display: none; }
  .overlay { display: none !important; }
}

@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes dotPulse { 0%,80%,100%{opacity:0.3;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
</style>
</head>
<body>

<!-- オーバーレイ（モバイル） -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- サイドバー -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">AI Oracle</div>
    <button class="new-chat-btn" onclick="newChat()">＋ 新しいチャット</button>
  </div>
  <div class="sidebar-section-title">チャット履歴</div>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-footer">
    <button class="settings-btn" onclick="toggleSettings()">⚙ サーバー設定</button>
  </div>
</div>

<!-- メイン -->
<div class="main">

  <!-- モバイルヘッダー -->
  <div class="mobile-header">
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="mobile-logo">AI Oracle</div>
  </div>

  <!-- 設定パネル -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-field">
      <label>サーバーURL</label>
      <input type="text" id="serverUrl" placeholder="http://192.168.1.30:8002">
    </div>
    <button class="save-settings-btn" onclick="saveSettings()">保存</button>
  </div>

  <!-- チャットエリア -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-logo">AI Oracle</div>
      <div class="empty-desc">Gemini × OpenRouter<br>複数のAIが回答し、Geminiが結論をまとめます</div>
      <div class="empty-suggestions">
        <button class="suggestion-btn" onclick="useSuggestion('今日の栃木の天気を教えてください')">今日の栃木の天気を教えてください</button>
        <button class="suggestion-btn" onclick="useSuggestion('ServiceNow CIS-DF試験の出題傾向は？')">ServiceNow CIS-DF試験の出題傾向は？</button>
        <button class="suggestion-btn" onclick="useSuggestion('近所のスーパーで安く買い物するコツは？')">近所のスーパーで安く買い物するコツは？</button>
      </div>
    </div>
  </div>

  <!-- 入力エリア -->
  <div class="input-area">
    <div class="input-box">
      <textarea
        id="questionInput"
        placeholder="質問を入力..."
        rows="1"
        oninput="autoResize(this)"
        onkeydown="handleKeydown(event)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="ask()">➤</button>
    </div>
    <div class="input-hint">Cmd+Enter で送信</div>
  </div>

</div>

<script>
// ═══════════════════════════════════════
// データ管理
// ═══════════════════════════════════════
const CHATS_KEY    = 'ai_oracle_chats';
const SETTINGS_KEY = 'ai_oracle_v4_settings';

let chats          = JSON.parse(localStorage.getItem(CHATS_KEY) || '[]');
let currentChatId  = null;

function saveChats() {
  localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
}

function getSettings() {
  return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"serverUrl":"http://192.168.1.30:8002"}');
}

function saveSettings() {
  const s = { serverUrl: document.getElementById('serverUrl').value.trim() };
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  document.getElementById('settingsPanel').classList.remove('open');
  showToast('✓ 設定を保存しました');
}

// ═══════════════════════════════════════
// チャット管理
// ═══════════════════════════════════════
function newChat() {
  const id = Date.now().toString();
  const chat = {
    id,
    title: '新しいチャット',
    messages: [],
    createdAt: new Date().toISOString(),
  };
  chats.unshift(chat);
  saveChats();
  selectChat(id);
  renderChatList();
  closeSidebar();
}

function selectChat(id) {
  currentChatId = id;
  renderChatList();
  renderMessages();
  document.getElementById('questionInput').focus();
}

function deleteChat(id, e) {
  e.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  saveChats();
  if (currentChatId === id) {
    currentChatId = null;
    renderMessages();
  }
  renderChatList();
}

function getCurrentChat() {
  return chats.find(c => c.id === currentChatId);
}

// ═══════════════════════════════════════
// レンダリング
// ═══════════════════════════════════════
function renderChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = chats.map(c => `
    <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="selectChat('${c.id}')">
      <span class="chat-item-title">${escHtml(c.title)}</span>
      <button class="chat-item-del" onclick="deleteChat('${c.id}', event)">✕</button>
    </div>
  `).join('');
}

function renderMessages() {
  const area  = document.getElementById('chatArea');
  const empty = document.getElementById('emptyState');
  const chat  = getCurrentChat();

  if (!chat || chat.messages.length === 0) {
    area.innerHTML = '';
    area.appendChild(empty || createEmptyState());
    document.getElementById('emptyState') && (document.getElementById('emptyState').style.display = 'flex');
    return;
  }

  area.innerHTML = chat.messages.map((msg, i) => {
    if (msg.role === 'user') {
      return `
        <div class="message message-user">
          <div class="message-user-bubble">${escHtml(msg.content)}</div>
        </div>
      `;
    } else {
      return renderAIMessage(msg.data, i);
    }
  }).join('');

  area.scrollTop = area.scrollHeight;
}

function renderAIMessage(data, idx) {
  const answersHtml = (data.answers || []).map((a, i) => `
    <div class="answer-item">
      <div class="answer-header" onclick="toggleAnswer('${idx}-${i}')">
        <span class="answer-model">🤖 ${escHtml(a.model.split('/').pop())}</span>
        <span class="answer-toggle" id="toggle-${idx}-${i}">▼ 展開</span>
      </div>
      <div class="answer-body" id="answer-${idx}-${i}">
        <div class="answer-text">${escHtml(a.answer || '回答なし')}</div>
      </div>
    </div>
  `).join('');

  const modelsHtml = (data.models_used || []).map(m =>
    `<span class="model-badge">${escHtml(m.split('/').pop())}</span>`
  ).join('');

  return `
    <div class="message message-ai">
      <div class="conclusion-card">
        <div class="conclusion-header">
          <span class="conclusion-label">🔮 Geminiの結論</span>
          ${data.has_contradiction ? '<span class="contradiction-badge">⚠ 矛盾あり</span>' : ''}
        </div>
        <div class="conclusion-text">${escHtml(data.conclusion || '')}</div>
        ${data.has_contradiction && data.contradiction_detail ? `<div class="contradiction-detail">⚠ ${escHtml(data.contradiction_detail)}</div>` : ''}
      </div>
      <div class="models-row">
        <span class="models-label">使用AI</span>
        ${modelsHtml}
      </div>
      <div class="answers-list">${answersHtml}</div>
    </div>
  `;
}

function toggleAnswer(key) {
  const body   = document.getElementById(`answer-${key}`);
  const toggle = document.getElementById(`toggle-${key}`);
  if (!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  toggle.textContent = isOpen ? '▼ 展開' : '▲ 閉じる';
}

function createEmptyState() {
  const div = document.createElement('div');
  div.className = 'empty-state';
  div.id = 'emptyState';
  div.innerHTML = `
    <div class="empty-logo">AI Oracle</div>
    <div class="empty-desc">Gemini × OpenRouter<br>複数のAIが回答し、Geminiが結論をまとめます</div>
    <div class="empty-suggestions">
      <button class="suggestion-btn" onclick="useSuggestion('今日の栃木の天気を教えてください')">今日の栃木の天気を教えてください</button>
      <button class="suggestion-btn" onclick="useSuggestion('ServiceNow CIS-DF試験の出題傾向は？')">ServiceNow CIS-DF試験の出題傾向は？</button>
      <button class="suggestion-btn" onclick="useSuggestion('近所のスーパーで安く買い物するコツは？')">近所のスーパーで安く買い物するコツは？</button>
    </div>
  `;
  return div;
}

// ═══════════════════════════════════════
// 質問送信
// ═══════════════════════════════════════
async function ask() {
  const input    = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question) return;

  const s = getSettings();
  if (!s.serverUrl) {
    showToast('⚙ サーバーURLを設定してください');
    toggleSettings();
    return;
  }

  // チャットがなければ新規作成
  if (!currentChatId) newChat();

  const chat = getCurrentChat();
  if (!chat) return;

  // ユーザーメッセージを追加
  chat.messages.push({ role: 'user', content: question });

  // タイトルを最初の質問から設定
  if (chat.title === '新しいチャット') {
    chat.title = question.length > 20 ? question.slice(0, 20) + '...' : question;
  }

  saveChats();
  renderChatList();

  // 入力クリア
  input.value = '';
  input.style.height = 'auto';

  // メッセージを描画
  renderMessages();

  // ローディングを追加
  const area = document.getElementById('chatArea');
  const loading = document.createElement('div');
  loading.className = 'message message-ai';
  loading.id = 'loadingMsg';
  loading.innerHTML = `
    <div class="loading-message">
      <div class="loading-dots">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
      <span>Gemini CLIが処理中...</span>
    </div>
  `;
  area.appendChild(loading);
  area.scrollTop = area.scrollHeight;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  try {
    const res = await fetch(`${s.serverUrl}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });

    const data = await res.json();

    // ローディング削除
    document.getElementById('loadingMsg')?.remove();

    if (!data.success) throw new Error(data.error || '不明なエラー');

    // AIメッセージを追加
    chat.messages.push({ role: 'ai', data });
    saveChats();
    renderMessages();

  } catch(e) {
    document.getElementById('loadingMsg')?.remove();
    showToast('エラー: ' + e.message);
    // エラーメッセージを追加
    chat.messages.push({
      role: 'ai',
      data: {
        conclusion: 'エラーが発生しました: ' + e.message,
        models_used: [],
        answers: [],
        has_contradiction: false,
      }
    });
    saveChats();
    renderMessages();
  } finally {
    btn.disabled = false;
  }
}

// ═══════════════════════════════════════
// UI操作
// ═══════════════════════════════════════
function useSuggestion(text) {
  if (!currentChatId) newChat();
  document.getElementById('questionInput').value = text;
  ask();
}

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('open');
  const s = getSettings();
  document.getElementById('serverUrl').value = s.serverUrl || '';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function handleKeydown(e) {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    ask();
  }
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1c1c26;border:1px solid #2a2a3a;color:#e8e8f0;padding:0.6rem 1.2rem;border-radius:8px;font-size:0.78rem;z-index:999;animation:fadeUp 0.3s ease;white-space:nowrap';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// 初期化
renderChatList();
renderMessages();
</script>
</body>
</html>
