<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent: #7c6af7;
    --accent2: #4fd1c5;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #48bb78;
    --warning: #f6ad55;
    --danger: #fc8181;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.6s ease;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  /* 設定パネル */
  .settings-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 0.4rem 0.8rem;
    transition: all 0.2s;
    margin-bottom: 1rem;
    display: block;
  }
  .settings-toggle:hover { color: var(--text); border-color: var(--accent); }

  .settings-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .settings-panel.open { display: block; animation: fadeUp 0.2s ease; }

  .settings-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .settings-field { flex: 1; min-width: 200px; }
  .settings-field label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .settings-field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 0.6rem 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .settings-field input:focus { border-color: var(--accent); }

  .settings-note {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.75rem;
    padding: 0.5rem 0.75rem;
    background: rgba(124,106,247,0.06);
    border: 1px solid rgba(124,106,247,0.15);
    border-radius: 6px;
  }

  .save-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 0.6rem 1.2rem;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .save-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 入力エリア */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .input-label {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    padding: 1rem;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    min-height: 100px;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .input-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1rem;
    gap: 1rem;
  }

  .char-count { font-size: 0.75rem; color: var(--muted); }

  .ask-btn {
    background: linear-gradient(135deg, var(--accent), #5a4fd4);
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.75rem 2rem;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .ask-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124,106,247,0.35);
  }
  .ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* プロセス表示 */
  .process-bar {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  .process-bar.active { display: block; animation: fadeUp 0.3s ease; }

  .process-steps { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .step {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    color: var(--muted);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: all 0.3s;
  }
  .step.active { color: var(--accent2); border-color: var(--accent2); background: rgba(79,209,197,0.08); }
  .step.done   { color: var(--success); border-color: var(--success); background: rgba(72,187,120,0.08); }

  .step-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .step.active .step-dot { animation: pulse 1s infinite; }

  /* 結果 */
  .result-card { display: none; }
  .result-card.visible { display: block; animation: fadeUp 0.4s ease; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    font-weight: 500;
  }
  .badge-high   { background: rgba(72,187,120,0.15); color: var(--success); border: 1px solid rgba(72,187,120,0.3); }
  .badge-medium { background: rgba(246,173,85,0.15); color: var(--warning); border: 1px solid rgba(246,173,85,0.3); }
  .badge-low    { background: rgba(252,129,129,0.15); color: var(--danger);  border: 1px solid rgba(252,129,129,0.3); }

  .answer-text {
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .meta-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
  }
  .meta-label { font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
  .meta-value { font-size: 0.85rem; color: var(--text); font-weight: 500; }

  .contradiction-alert {
    background: rgba(252,129,129,0.08);
    border: 1px solid rgba(252,129,129,0.3);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.82rem;
    color: var(--danger);
    display: flex;
    gap: 0.5rem;
  }

  .supplement-box {
    background: rgba(79,209,197,0.06);
    border: 1px solid rgba(79,209,197,0.2);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-top: 0.75rem;
    font-size: 0.82rem;
    color: var(--accent2);
  }

  /* 履歴 */
  .history-section { margin-top: 2rem; }
  .history-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.82rem;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-q { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-meta { font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-size: 0.8rem;
    z-index: 999;
    animation: fadeUp 0.3s ease;
  }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
  }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(12px);  } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes spin     { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .logo { font-size: 2rem; }
    .meta-grid { grid-template-columns: 1fr 1fr; }
    .settings-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">AI Oracle</div>
    <div class="tagline">Gemini（画面操作）× OpenRouter · API不要</div>
  </header>

  <!-- 設定 -->
  <button class="settings-toggle" onclick="toggleSettings()">⚙ 設定</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-row">
      <div class="settings-field">
        <label>サーバーURL（MacのIPアドレス）</label>
        <input type="text" id="serverUrl" placeholder="http://192.168.1.30:8001">
      </div>
      <div class="settings-field">
        <label>OpenRouter API Key</label>
        <input type="password" id="openrouterKey" placeholder="sk-or-...">
      </div>
      <button class="save-btn" onclick="saveSettings()">保存</button>
    </div>
    <div class="settings-note">
      💡 GeminiはMac上のPlaywrightが自動操作します。Gemini APIキーは不要です。
    </div>
  </div>

  <!-- 入力 -->
  <div class="input-section">
    <div class="input-label">質問を入力　（Cmd+Enter で送信）</div>
    <textarea
      id="questionInput"
      placeholder="何でも聞いてください。GeminiとOpenRouterが連携して回答します..."
      oninput="updateCharCount(this)"
      onkeydown="handleKeydown(event)"
    ></textarea>
    <div class="input-footer">
      <span class="char-count" id="charCount">0文字</span>
      <button class="ask-btn" id="askBtn" onclick="ask()">回答を生成</button>
    </div>
  </div>

  <!-- プロセス -->
  <div class="process-bar" id="processBar">
    <div class="process-steps">
      <div class="step" id="step1"><div class="step-dot"></div>Gemini分析中</div>
      <div class="step" id="step2"><div class="step-dot"></div>モデル選択</div>
      <div class="step" id="step3"><div class="step-dot"></div>OpenRouter回答生成</div>
      <div class="step" id="step4"><div class="step-dot"></div>Gemini矛盾チェック</div>
      <div class="step" id="step5"><div class="step-dot"></div>最終出力</div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="result-card" id="resultCard">
    <div class="meta-grid" id="metaGrid"></div>
    <div class="contradiction-alert" id="contradictionAlert" style="display:none">
      ⚠ <span id="contradictionText"></span>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">最終回答</span>
        <span class="badge" id="confidenceBadge"></span>
      </div>
      <div class="answer-text" id="finalAnswer"></div>
      <div class="supplement-box" id="supplementBox" style="display:none"></div>
    </div>
    <details style="margin-bottom:1rem">
      <summary style="cursor:pointer;font-size:0.78rem;color:var(--muted);padding:0.5rem 0">
        OpenRouterの元回答を表示
      </summary>
      <div class="card" style="margin-top:0.5rem;border-color:rgba(255,255,255,0.05)">
        <div class="card-title" style="margin-bottom:0.75rem">OpenRouter 生回答</div>
        <div class="answer-text" id="mainAnswer" style="color:var(--muted)"></div>
      </div>
    </details>
  </div>

  <!-- 履歴 -->
  <div class="history-section" id="historySection" style="display:none">
    <div class="history-title">最近の質問</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
const STORAGE_KEY    = 'ai_oracle_settings';
const HISTORY_KEY    = 'ai_oracle_history';
let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

function getSettings() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
}

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('open');
  const s = getSettings();
  if (s.serverUrl)     document.getElementById('serverUrl').value = s.serverUrl;
  if (s.openrouter)    document.getElementById('openrouterKey').value = s.openrouter;
}

function saveSettings() {
  const s = {
    serverUrl:   document.getElementById('serverUrl').value.trim(),
    openrouter:  document.getElementById('openrouterKey').value.trim(),
  };
  if (!s.serverUrl || !s.openrouter) {
    showToast('両方の項目を入力してください');
    return;
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  document.getElementById('settingsPanel').classList.remove('open');
  showToast('✓ 設定を保存しました');
}

async function ask() {
  const question = document.getElementById('questionInput').value.trim();
  if (!question) return;

  const s = getSettings();
  if (!s.serverUrl || !s.openrouter) {
    showToast('⚙ 設定からサーバーURLとAPIキーを入力してください');
    toggleSettings();
    return;
  }

  const btn = document.getElementById('askBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 処理中...';

  document.getElementById('processBar').classList.add('active');
  document.getElementById('resultCard').classList.remove('visible');
  resetSteps();

  try {
    setStep('step1', 'active');

    const res = await fetch(`${s.serverUrl}/ask`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        openrouter_key: s.openrouter,
      }),
    });

    setStep('step1', 'done');
    setStep('step2', 'active');
    await delay(300);
    setStep('step2', 'done');
    setStep('step3', 'active');
    await delay(300);
    setStep('step3', 'done');
    setStep('step4', 'active');

    const data = await res.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');

    setStep('step4', 'done');
    setStep('step5', 'active');
    await delay(200);
    setStep('step5', 'done');

    renderResult(data);
    saveHistory(question, data.analysis?.category, data.confidence);

  } catch(e) {
    console.error(e);
    showToast('エラー: ' + e.message);
    resetSteps();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '回答を生成';
    document.getElementById('processBar').classList.remove('active');
  }
}

const MODELS = {
  general:   'llama-4-maverick',
  reasoning: 'deepseek-r1',
  japanese:  'gemma-3-27b',
  code:      'qwen3-14b',
  fast:      'mistral-small',
};

function renderResult(data) {
  const { analysis, main_answer, has_contradiction, contradiction,
          confidence, final_answer, supplement } = data;

  document.getElementById('metaGrid').innerHTML = `
    <div class="meta-item">
      <div class="meta-label">カテゴリ</div>
      <div class="meta-value">${analysis?.category || '—'}</div>
    </div>
    <div class="meta-item">
      <div class="meta-label">使用モデル</div>
      <div class="meta-value" style="font-size:0.75rem">${MODELS[analysis?.category] || '—'}</div>
    </div>
    <div class="meta-item">
      <div class="meta-label">Gemini</div>
      <div class="meta-value">画面操作</div>
    </div>
    <div class="meta-item">
      <div class="meta-label">判断理由</div>
      <div class="meta-value" style="font-size:0.78rem">${analysis?.reason || '—'}</div>
    </div>
  `;

  const alertEl = document.getElementById('contradictionAlert');
  if (has_contradiction && contradiction) {
    document.getElementById('contradictionText').textContent = contradiction;
    alertEl.style.display = 'flex';
  } else {
    alertEl.style.display = 'none';
  }

  const confMap = {
    high:   ['badge-high',   '信頼度: 高'],
    medium: ['badge-medium', '信頼度: 中'],
    low:    ['badge-low',    '信頼度: 低'],
  };
  const [cls, label] = confMap[confidence] || confMap.medium;
  const badge = document.getElementById('confidenceBadge');
  badge.className = 'badge ' + cls;
  badge.textContent = label;

  document.getElementById('finalAnswer').textContent = final_answer || main_answer;
  document.getElementById('mainAnswer').textContent  = main_answer;

  const suppEl = document.getElementById('supplementBox');
  if (supplement) {
    suppEl.textContent = '💡 ' + supplement;
    suppEl.style.display = 'block';
  } else {
    suppEl.style.display = 'none';
  }

  document.getElementById('resultCard').classList.add('visible');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function saveHistory(question, category, confidence) {
  history.unshift({ question, category, confidence, time: new Date().toLocaleString('ja-JP') });
  history = history.slice(0, 10);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  if (!history.length) return;
  document.getElementById('historySection').style.display = 'block';
  document.getElementById('historyList').innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="loadHistory(${i})">
      <div class="history-q">${h.question}</div>
      <div class="history-meta">${h.time} · ${h.category || ''} · ${h.confidence || ''}</div>
    </div>
  `).join('');
}

function loadHistory(i) {
  document.getElementById('questionInput').value = history[i].question;
  updateCharCount(document.getElementById('questionInput'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateCharCount(el) {
  document.getElementById('charCount').textContent = el.value.length + '文字';
}

function handleKeydown(e) {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask();
}

function setStep(id, state) {
  document.getElementById(id).className = 'step ' + state;
}

function resetSteps() {
  ['step1','step2','step3','step4','step5'].forEach(id => {
    document.getElementById(id).className = 'step';
  });
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

renderHistory();
</script>
</body>
</html>
